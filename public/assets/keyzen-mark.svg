<svg width="622" height="680" viewBox="0 0 622 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="keyzenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a" />
      <stop offset="1" stop-color="#7ad1ff" />
    </linearGradient>
  </defs>

  <!-- keyboard base -->
  <rect x="151" y="170" width="320" height="150" rx="16" fill="none" stroke="url(#keyzenGrad)" stroke-width="2.5" opacity="0.85" />

  <!-- key row -->
  <g fill="none" stroke="url(#keyzenGrad)" stroke-width="1.6" opacity="0.7">
    <rect x="171" y="190" width="34" height="34" rx="6" />
    <rect x="213" y="190" width="34" height="34" rx="6" />
    <rect x="255" y="190" width="34" height="34" rx="6" />
    <rect x="297" y="190" width="34" height="34" rx="6" />
    <rect x="339" y="190" width="34" height="34" rx="6" />
    <rect x="381" y="190" width="34" height="34" rx="6" />
    <rect x="423" y="190" width="28" height="34" rx="6" />
  </g>

  <!-- bottom row with highlighted spacebar -->
  <rect x="231" y="234" width="160" height="30" rx="7" fill="url(#keyzenGrad)" opacity="0.9" />
  <g fill="none" stroke="url(#keyzenGrad)" stroke-width="1.6" opacity="0.7">
    <rect x="171" y="234" width="48" height="30" rx="6" />
    <rect x="403" y="234" width="48" height="30" rx="6" />
  </g>

  <!-- typing caret -->
  <rect x="300" y="356" width="4" height="34" rx="2" fill="url(#keyzenGrad)" />

  <text x="311" y="470" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="52" letter-spacing="-2" fill="#e8e8e2">Keyzen</text>
  <text x="311" y="502" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="13" letter-spacing="2.5" fill="#8a8a82">TYPING TEST · PWA</text>
</svg>
